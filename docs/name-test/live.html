<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Name Test Live</title>
<style>
  :root { --bg: #0d1017; --panel: #161b25; --line: #2a3242; --text: #e8ecf3; --muted: #9aa5b8; --live: #4fd18b; --wait: #e6b450; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px 16px; background: var(--bg); color: var(--text); font: 15px/1.5 -apple-system, "PingFang SC", sans-serif; }
  main { max-width: 860px; margin: auto; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p { color: var(--muted); margin: 0 0 20px; }
  .runs { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; margin-bottom: 24px; }
  .run { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
  .run h2 { font-size: 16px; margin: 0 0 6px; }
  .state { font-weight: 600; color: var(--wait); }
  .state.running { color: var(--live); }
  .bar { height: 6px; background: var(--line); border-radius: 3px; margin: 10px 0; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--live); }
  .num { color: var(--muted); font-size: 13px; }
  .post { border-top: 1px solid var(--line); padding: 10px 0; }
  .who { font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Name test, live</h1>
  <p>Read-only view of MiroFish. Same browser, different name. Agents are AI personas, not real people, and they're posting in Chinese.</p>
  <section class="runs" id="runs"></section>
  <h2>Latest posts</h2>
  <section id="posts"></section>
</main>
<script>
const API = "http://127.0.0.1:5001/api/simulation";
const NAMES = ["Jazznaut", "Horus"];
const get = async (u) => { const r = await fetch(u, { cache: "no-store" }); if (!r.ok) throw new Error(r.status); return r.json(); };
const esc = (s) => String(s ?? "").replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
async function tick() {
  const cards = [];
  const posts = [];
  for (const name of NAMES) {
    let s = null;
    try { s = await get(`results/${name}.json`); } catch {}
    if (!s) { cards.push(`<div class="run"><h2>${name}</h2><span class="state">Waiting its turn</span></div>`); continue; }
    try {
      const st = (await get(`${API}/${s.simulation}/run-status`)).data;
      const pct = st.total_rounds ? Math.round(100 * st.current_round / st.total_rounds) : 0;
      cards.push(`<div class="run"><h2>${name}</h2><span class="state ${esc(st.runner_status)}">${esc(st.runner_status)}</span><div class="bar"><i style="width:${pct}%"></i></div><div class="num">Round ${st.current_round} of ${st.total_rounds} · ${st.total_actions_count} actions</div></div>`);
      const a = (await get(`${API}/${s.simulation}/actions?limit=200`)).data;
      for (const x of a.actions ?? a) if (x.action_args?.content) posts.push({ name, ...x });
    } catch { cards.push(`<div class="run"><h2>${name}</h2><span class="state">Starting</span></div>`); }
  }
  document.getElementById("runs").innerHTML = cards.join("");
  posts.sort((p, q) => String(q.timestamp).localeCompare(String(p.timestamp)));
  document.getElementById("posts").innerHTML = posts.slice(0, 20).map((p) => `<div class="post"><div class="who">${esc(p.name)} · ${esc(p.platform)} · ${esc(p.agent_name)}</div>${esc(p.action_args.content)}</div>`).join("") || "<p>No posts yet.</p>";
}
tick(); setInterval(tick, 5000);
</script>
</body>
</html>
