# Builds the AetherDeck desktop app (Electron) for macOS, Windows and Linux and attaches the installers to the GitHub
# release for the version in package.json. Run it by hand only (Actions → Release → Run workflow): v* tags are now the
# releases of AetherDeck for Mac (the browser), and running this on them attached Electron installers to those releases.
name: Release
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build
      - run: node scripts/build-electron.mjs
      - name: Package and upload
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
