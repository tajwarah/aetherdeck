# Weekly pull requests for outdated or vulnerable packages, and monthly ones for the GitHub Actions the workflows use.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-tools:
        dependency-type: development
        update-types: [minor, patch]
    # Major versions (React 19, Vite 8, TypeScript 7…) change how things work: they're upgraded on purpose, not by a bot.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
