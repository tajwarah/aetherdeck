    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55"><stop offset="0" stop-color="#3d6fd1" stop-opacity="0.55"/><stop offset="1" stop-color="#3d6fd1" stop-opacity="0"/></radialGradient>
